services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/libraryms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    volumes:
      - mongo7_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo7_data:
